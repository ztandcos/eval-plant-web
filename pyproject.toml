[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalplant"
version = "0.1.0"
description = "Offline failure attribution for coding-agent trajectories"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.0",
  "rich>=13.0",
]

[project.scripts]
evalplant = "evalplant.cli:main"

[tool.setuptools.packages.find]
include = ["evalplant*"]

