[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalplant"
version = "0.2.0"
description = "Harbor trajectory evaluation and failure attribution for coding agents"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.0",
  "rich>=13.0",
  "socksio>=1.0",
]

[project.scripts]
evalplant = "evalplant.cli:main"

[tool.setuptools.packages.find]
include = ["evalplant*"]
