suite: my-multi

agents:
  - name: codex-flash
    agent: codex
    model: deepseek/deepseek-v4-flash
    n_concurrent: 1
    agent_kwargs:
      reasoning_effort: low

  - name: claude-flash
    agent: claude-code
    model: deepseek/deepseek-v4-flash
    n_concurrent: 1

benchmarks:
  - path: ../evals
    tasks: [smoke-file]

trials: 1
concurrency: 2
sandbox: docker
env: [DEEPSEEK_API_KEY]

bootstrap:
  image: evalplat-agent-base:local
  dockerfile: ../docker/agent-base.Dockerfile
  context: ..

diagnosis:
  policy: all_final_non_pass
  judge_model: deepseek/deepseek-v4-flash

recovery:
  max_infra_retries: 1
  max_job_resumes: 1
  agent_setup_timeout_multiplier: 3

comparison:
  baseline: codex-flash
  candidates: [claude-flash]

metrics: [pass@1, latency]
