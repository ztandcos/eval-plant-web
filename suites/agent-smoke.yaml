suite: evalplant-agent-smoke

baseline:
  name: oracle
  agent: oracle

candidates:
  - name: dsh-flash
    agent: dsh
    model: deepseek/deepseek-v4-flash

benchmarks:
  - path: ../evals
    tasks: [smoke-file]

trials: 1
concurrency: 1
sandbox: docker
env: [DEEPSEEK_API_KEY]
metrics: [pass@1, cost, latency]
judge_model: deepseek-v4-pro

gate:
  pass_at_1_drop: 0.0
  max_regressions: 0
  cost_increase: 0.20
