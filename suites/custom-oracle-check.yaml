suite: custom-oracle-check

agents:
  - name: oracle
    agent: oracle

benchmarks:
  - path: ../evals
    tasks:
      - smoke-file
      - fix-off-by-one
      - split-module
      - json-merge
      - log-count
      - http-echo
      - heartbeat-worker
      - needle-context
      - config-validate
      - fix-and-prove

trials: 1
concurrency: 4
sandbox: docker
bootstrap:
  image: evalplat-agent-base:local
  dockerfile: ../docker/agent-base.Dockerfile
  context: ..
metrics: [pass@1]

diagnosis:
  policy: all_final_non_pass
  judge_model: not-called

recovery:
  max_infra_retries: 1
  max_job_resumes: 1

gate:
  k: 1
  pass_at_1_drop: 0.0
  max_regressions: 0
  cost_increase: 1.0
