suite: custom-ci

agents:
  - name: dsh-flash
    agent: dsh
    model: deepseek/deepseek-v4-flash
    n_concurrent: 1

  - name: dsh-pro
    agent: dsh
    model: deepseek/deepseek-v4-pro
    n_concurrent: 1

benchmarks:
  - path: ../evals
    tasks:
      - smoke-file
      - fix-off-by-one
      - json-merge
      - log-count

trials: 1
concurrency: 2
sandbox: docker
env: [DEEPSEEK_API_KEY]
metrics: [pass@1, cost, latency]

diagnosis:
  policy: all_final_non_pass
  judge_model: deepseek-v4-pro

recovery:
  max_infra_retries: 1
  max_job_resumes: 1

comparison:
  baseline: dsh-flash
  candidates: [dsh-pro]

gate:
  k: 1
  pass_at_1_drop: 0.05
  max_regressions: 2
  cost_increase: 0.50
