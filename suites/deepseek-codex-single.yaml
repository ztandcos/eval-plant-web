suite: deepseek-codex-single

agents:
  - name: codex-flash
    agent: codex
    model: deepseek/deepseek-v4-flash
    n_concurrent: 1
    agent_kwargs:
      reasoning_effort: high

benchmarks:
  - path: ../evals
    tasks: [fix-off-by-one]

trials: 1
concurrency: 1
sandbox: docker
env: [DEEPSEEK_API_KEY]
bootstrap:
  image: evalplat-agent-base:local
  dockerfile: ../docker/agent-base.Dockerfile
  context: ..
  retries: 3
  retry_delay_seconds: 10
  timeout_seconds: 1800
diagnosis:
  policy: all_final_non_pass
  judge_model: deepseek/deepseek-v4-flash
recovery:
  max_infra_retries: 2
  max_job_resumes: 1
  agent_setup_timeout_multiplier: 3
metrics: [pass@1, latency]
