suite: evalplant-smoke

baseline:
  name: oracle-baseline
  agent: oracle

candidates:
  - name: oracle-candidate
    agent: oracle

benchmarks:
  - path: ../evals
    tasks: [smoke-file]

trials: 1
concurrency: 1
sandbox: docker
metrics: [pass@1, cost, latency]

gate:
  pass_at_1_drop: 0.0
  max_regressions: 0
  cost_increase: 0.20
