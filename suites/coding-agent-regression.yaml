suite: coding-agent-regression

agents:
  - name: dsh-flash
    agent: dsh
    model: deepseek/deepseek-v4-flash
    n_concurrent: 3

  - name: dsh-pro
    agent: dsh
    model: deepseek/deepseek-v4-pro
    n_concurrent: 3

benchmarks:
  - name: terminal-bench@2.0
    tasks:
      - kv-store-grpc
      - nginx-request-logging
      - openssl-selfsigned-cert
      - fix-git
      - sqlite-db-truncate
      - sanitize-git-repo
      - configure-git-webserver
      - regex-log
      - log-summary-date-ranges
      - cancel-async-tasks
      - filter-js-from-html
      - db-wal-recovery

trials: 3
concurrency: 6
sandbox: docker
env: [DEEPSEEK_API_KEY]
metrics: [pass@1, pass@3, cost, latency]

diagnosis:
  policy: all_final_non_pass
  judge_model: deepseek-v4-pro

recovery:
  max_infra_retries: 1
  max_job_resumes: 1

comparison:
  baseline: dsh-flash
  candidates: [dsh-pro]

gate:
  k: 1
  pass_at_1_drop: 0.02
  max_regressions: 3
  cost_increase: 0.20
