suite: my-single

agents:
  - name: only-codex
    agent: codex
    model: deepseek/deepseek-v4-flash
    n_concurrent: 1
    agent_kwargs:
      reasoning_effort: low

benchmarks:
  - path: ../evals
    tasks: [smoke-file]

trials: 1
concurrency: 1
sandbox: docker
env: [DEEPSEEK_API_KEY]

bootstrap:
  image: evalplat-agent-base:local
  dockerfile: ../docker/agent-base.Dockerfile
  context: ..

diagnosis:
  policy: all_final_non_pass
  judge_model: deepseek/deepseek-v4-flash

recovery:
  max_infra_retries: 1
  max_job_resumes: 1
  agent_setup_timeout_multiplier: 3

metrics: [pass@1, latency]
