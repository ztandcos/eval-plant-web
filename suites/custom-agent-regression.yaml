suite: custom-agent-regression

agents:
  - name: dsh-flash
    agent: dsh
    model: deepseek/deepseek-v4-flash
    n_concurrent: 2

  - name: dsh-pro
    agent: dsh
    model: deepseek/deepseek-v4-pro
    n_concurrent: 2

benchmarks:
  - path: ../evals
    tasks:
      - smoke-file
      - fix-off-by-one
      - split-module
      - json-merge
      - log-count
      - http-echo
      - heartbeat-worker
      - needle-context
      - config-validate
      - fix-and-prove

trials: 3
concurrency: 3
sandbox: docker
env: [DEEPSEEK_API_KEY]
metrics: [pass@1, pass@3, cost, latency]

diagnosis:
  policy: all_final_non_pass
  judge_model: deepseek-v4-pro

recovery:
  max_infra_retries: 1
  max_job_resumes: 1

comparison:
  baseline: dsh-flash
  candidates: [dsh-pro]

gate:
  k: 1
  pass_at_1_drop: 0.02
  max_regressions: 2
  cost_increase: 0.20
